name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias emberlink \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass emberlink -keypass emberlink \
            -dname "CN=Emberlink, O=Emberlink, C=CA"
          printf 'storeFile=release.keystore\nstorePassword=emberlink\nkeyAlias=emberlink\nkeyPassword=emberlink\n' > keystore.properties

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Emberlink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Emberlink-apk
          path: out/Emberlink.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Emberlink v1.0.${{ github.run_number }}
          files: out/Emberlink.apk
